worker_processes 1;
daemon off;

error_log stderr;
events { worker_connections 1024; }

http {
  set_real_ip_from  10.0.0.0/8;
  real_ip_header    X-Forwarded-For;
  charset utf-8;
  log_format cnb 'fd $http_x_forwarded_for - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout cnb;
  default_type application/octet-stream;
  include mime.types;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off;

  server {
    listen {{port}};
    server_name _;
    root public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location / {
      try_files $uri $uri/ =404;
    }
    location /stl/ {
          # CORS for Ghost cross-origin STL fetches
          add_header Access-Control-Allow-Origin "*" always;
          add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Range" always;

          # Repeat security headers (nginx drops server-level add_header in location blocks)
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

          # Cache static assets
          expires 7d;
          add_header Cache-Control "public, immutable" always;

          # Handle CORS preflight
          if ($request_method = OPTIONS) {
            return 204;
          }

          try_files $uri =404;
    }

    location ~ /\. {
      deny all;
    }

    location ~* \.(?:env|git|yml|yaml|json|log|sql)$ {
      deny all;
    }

    location = /404.html {
      internal;
    }
  }
}