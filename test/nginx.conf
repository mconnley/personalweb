worker_processes 1;
daemon off;

error_log stderr;
events { worker_connections 1024; }

http {
  set_real_ip_from  10.0.0.0/8;
  real_ip_header    X-Forwarded-For;
  charset utf-8;
  log_format cnb 'fd $http_x_forwarded_for - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout cnb;
  default_type application/octet-stream;
  include mime.types;
  sendfile on;

  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off; # Ensure that redirects don't include the internal container PORT - 8080

  server {
    listen {{port}};
    root public;
    index index.html;
    rewrite ^/(?!index\.html$|script\.js$|styles\.css$|profile\-image\.jpg$).+ /redirect last;

    location / {
      root public;
      index index.html;
    }

    location /redirect {
      return 301 https://connley.net;
    }
  }
}